<!DOCTYPE html>
<html lang="ko" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>티스토리 타임라인 에디터 Studio</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              500: '#0ea5e9',
              600: '#0284c7',
              700: '#0369a1',
            }
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;600;700&display=swap');

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }
    
    .font-serif-kr {
      font-family: 'Noto Serif KR', serif;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0,0,0,0.05);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(0,0,0,0.2);
      border-radius: 3px;
    }
    .dark ::-webkit-scrollbar-track {
      background: rgba(255,255,255,0.05);
    }
    .dark ::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.2);
    }
  </style>
</head>
<body class="h-full bg-slate-100 text-slate-800 dark:bg-slate-950 dark:text-slate-100 flex flex-col transition-colors duration-200">

  <!-- Header Bar -->
  <header class="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 px-4 py-3 sticky top-0 z-30 shrink-0">
    <div class="max-w-7xl mx-auto flex items-center justify-between gap-4">
      <div class="flex items-center gap-2.5">
        <div class="p-2 bg-indigo-500/10 text-indigo-600 dark:text-indigo-400 rounded-lg">
          <i data-lucide="git-commit" class="w-5 h-5"></i>
        </div>
        <div>
          <h1 class="font-bold text-lg leading-tight flex items-center gap-2">
            티스토리 타임라인 에디터
            <span class="text-[10px] font-semibold bg-indigo-100 text-indigo-600 dark:bg-indigo-950 dark:text-indigo-400 px-2 py-0.5 rounded-full">Studio</span>
          </h1>
          <p class="text-xs text-slate-500 dark:text-slate-400">Tistory Timeline & Narrative Generator</p>
        </div>
      </div>

      <!-- Header Action Controls -->
      <div class="flex items-center gap-2">
        <button id="themeToggleBtn" title="화면 테마 변경" class="p-2 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg transition">
          <i data-lucide="moon" class="w-5 h-5 dark:hidden"></i>
          <i data-lucide="sun" class="w-5 h-5 hidden dark:block"></i>
        </button>

        <button onclick="openSaveModal()" class="flex items-center gap-1.5 text-xs font-semibold px-3 py-2 bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 rounded-lg transition">
          <i data-lucide="save" class="w-4 h-4"></i>
          <span class="hidden sm:inline">저장/불러오기</span>
        </button>

        <button onclick="exportJSON()" class="flex items-center gap-1.5 text-xs font-semibold px-3 py-2 bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 rounded-lg transition" title="JSON 파일 내보내기">
          <i data-lucide="download" class="w-4 h-4"></i>
          <span class="hidden sm:inline">내보내기</span>
        </button>

        <label class="flex items-center gap-1.5 text-xs font-semibold px-3 py-2 bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 rounded-lg cursor-pointer transition" title="JSON 파일 불러오기">
          <i data-lucide="upload" class="w-4 h-4"></i>
          <span class="hidden sm:inline">가져오기</span>
          <input type="file" id="importJsonInput" accept=".json" class="hidden" onchange="importJSON(event)">
        </label>
      </div>
    </div>
  </header>

  <!-- Main Workspace Grid -->
  <div class="flex-1 max-w-7xl w-full mx-auto grid grid-cols-1 lg:grid-cols-12 gap-6 p-4 md:p-6 overflow-hidden">
    
    <!-- LEFT PANEL: Editor Input Forms -->
    <section class="lg:col-span-6 flex flex-col gap-5 overflow-y-auto pr-1">
      
      <!-- 1. Style Customization Settings -->
      <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-4 shadow-sm">
        <h2 class="text-sm font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-3 flex items-center gap-2">
          <i data-lucide="palette" class="w-4 h-4"></i> 스타일 커스텀
        </h2>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <!-- Accent Color Selector -->
          <div>
            <label class="block text-xs font-medium mb-1.5 text-slate-700 dark:text-slate-300">포인트 색상</label>
            <div class="flex items-center gap-2">
              <input type="color" id="accentColor" value="#6366f1" oninput="updateTimeline()" class="w-9 h-9 p-0.5 rounded border border-slate-300 dark:border-slate-700 cursor-pointer bg-transparent">
              <input type="text" id="accentColorText" value="#6366f1" oninput="syncColorInput(this.value)" class="flex-1 text-xs px-2.5 py-2 border border-slate-300 dark:border-slate-700 rounded bg-slate-50 dark:bg-slate-800 focus:outline-none focus:ring-1 focus:ring-indigo-500 uppercase font-mono">
            </div>
            <!-- Color Palette Preset Buttons -->
            <div class="flex gap-1.5 mt-2">
              <button onclick="setAccentColor('#6366f1')" class="w-5 h-5 rounded-full bg-[#6366f1] ring-1 ring-slate-300 dark:ring-slate-700" title="인디고"></button>
              <button onclick="setAccentColor('#3b82f6')" class="w-5 h-5 rounded-full bg-[#3b82f6] ring-1 ring-slate-300 dark:ring-slate-700" title="블루"></button>
              <button onclick="setAccentColor('#ec4899')" class="w-5 h-5 rounded-full bg-[#ec4899] ring-1 ring-slate-300 dark:ring-slate-700" title="핑크"></button>
              <button onclick="setAccentColor('#10b981')" class="w-5 h-5 rounded-full bg-[#10b981] ring-1 ring-slate-300 dark:ring-slate-700" title="에메랄드"></button>
              <button onclick="setAccentColor('#f59e0b')" class="w-5 h-5 rounded-full bg-[#f59e0b] ring-1 ring-slate-300 dark:ring-slate-700" title="앰버"></button>
              <button onclick="setAccentColor('#8b5cf6')" class="w-5 h-5 rounded-full bg-[#8b5cf6] ring-1 ring-slate-300 dark:ring-slate-700" title="바이올렛"></button>
              <button onclick="setAccentColor('#e11d48')" class="w-5 h-5 rounded-full bg-[#e11d48] ring-1 ring-slate-300 dark:ring-slate-700" title="로즈"></button>
              <button onclick="setAccentColor('#475569')" class="w-5 h-5 rounded-full bg-[#475569] ring-1 ring-slate-300 dark:ring-slate-700" title="슬레이트"></button>
            </div>
          </div>

          <!-- Font Family Selector -->
          <div>
            <label class="block text-xs font-medium mb-1.5 text-slate-700 dark:text-slate-300">서체 스타일</label>
            <select id="fontFamily" onchange="updateTimeline()" class="w-full text-xs px-2.5 py-2 border border-slate-300 dark:border-slate-700 rounded bg-slate-50 dark:bg-slate-800 focus:outline-none focus:ring-1 focus:ring-indigo-500">
              <option value="sans-serif">고딕체 (Pretendard / Sans-serif)</option>
              <option value="serif">명조체 (Noto Serif / Serif)</option>
            </select>
          </div>
        </div>
      </div>

      <!-- 2. Main Timeline Event Items -->
      <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-4 shadow-sm">
        <div class="flex items-center justify-between mb-3">
          <h2 class="text-sm font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider flex items-center gap-2">
            <i data-lucide="git-commit" class="w-4 h-4"></i> 메인 타임라인 항목
          </h2>
          <button onclick="addEventRow()" class="text-xs font-medium text-indigo-600 dark:text-indigo-400 hover:underline flex items-center gap-1">
            <i data-lucide="plus-circle" class="w-3.5 h-3.5"></i> 항목 추가
          </button>
        </div>
        
        <div id="eventsContainer" class="space-y-3">
          <!-- Dynamically Injected Event Inputs -->
        </div>
      </div>

      <!-- 3. Character Narrative Timeline (Toggle & Grid Controls) -->
      <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-4 shadow-sm">
        <div class="flex items-center justify-between mb-3">
          <div class="flex items-center gap-2">
            <h2 class="text-sm font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider flex items-center gap-2">
              <i data-lucide="users" class="w-4 h-4"></i> 인물별 타임라인
            </h2>
            <span class="text-[11px] px-2 py-0.5 rounded-full bg-indigo-50 dark:bg-indigo-950 text-indigo-600 dark:text-indigo-400 font-semibold">그리드 뷰</span>
          </div>

          <!-- Enable Switch Toggle -->
          <label class="relative inline-flex items-center cursor-pointer">
            <input type="checkbox" id="enableCharTimeline" onchange="toggleCharTimeline(this.checked)" class="sr-only peer">
            <div class="w-9 h-5 bg-slate-300 peer-focus:outline-none rounded-full peer dark:bg-slate-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all dark:after:border-slate-600 peer-checked:bg-indigo-600"></div>
            <span class="ml-2 text-xs font-bold text-slate-700 dark:text-slate-300" id="charTimelineStatusText">OFF</span>
          </label>
        </div>

        <!-- Character Inputs Section -->
        <div id="charTimelineSection" class="hidden space-y-4 pt-2 border-t border-slate-100 dark:border-slate-800">
          <div class="flex items-center justify-between">
            <p class="text-xs text-slate-500 dark:text-slate-400">인물별 서사를 시간선으로 작성할 수 있습니다. (1명이면 100% 가로 폭으로 넓어집니다)</p>
            <button onclick="addCharacterRow()" class="text-xs font-medium text-indigo-600 dark:text-indigo-400 hover:underline flex items-center gap-1">
              <i data-lucide="user-plus" class="w-3.5 h-3.5"></i> 인물 추가
            </button>
          </div>

          <div id="charactersContainer" class="space-y-4">
            <!-- Dynamically Injected Characters Inputs -->
          </div>
        </div>
      </div>

    </section>

    <!-- RIGHT PANEL: Live Interactive Preview & HTML Output -->
    <section class="lg:col-span-6 flex flex-col h-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl overflow-hidden shadow-sm">
      
      <!-- Panel Header Tabs -->
      <div class="flex items-center justify-between px-4 py-2 border-b border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-900/50">
        <div class="flex gap-1">
          <button id="tabPreviewBtn" onclick="switchTab('preview')" class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-white dark:bg-slate-800 text-indigo-600 dark:text-indigo-400 shadow-sm border border-slate-200 dark:border-slate-700">
            실시간 미리보기
          </button>
          <button id="tabCodeBtn" onclick="switchTab('code')" class="px-3 py-1.5 text-xs font-semibold rounded-lg text-slate-600 dark:text-slate-400 hover:bg-slate-200 dark:hover:bg-slate-800">
            티스토리 HTML 코드
          </button>
        </div>
        
        <!-- One-Click Copy HTML Button -->
        <button onclick="copyHTML()" class="flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold text-white bg-indigo-600 hover:bg-indigo-700 rounded-lg transition active:scale-95 shadow-sm">
          <i data-lucide="copy" class="w-3.5 h-3.5"></i>
          <span>티스토리용 HTML 복사하기</span>
        </button>
      </div>

      <!-- Tab Display Workspace -->
      <div class="flex-1 relative overflow-y-auto p-4 md:p-6 bg-slate-100/50 dark:bg-slate-950/50">
        
        <!-- Tab 1: Live Interactive Preview Canvas -->
        <div id="tabPreview" class="w-full h-full flex items-start justify-center">
          <div id="previewWrapper" class="w-full max-w-xl transition-all">
            <!-- Dynamic Rendered HTML -->
          </div>
        </div>

        <!-- Tab 2: HTML Code Box -->
        <div id="tabCode" class="hidden w-full h-full">
          <div class="relative h-full">
            <textarea id="generatedCode" readonly class="w-full h-full p-4 font-mono text-xs bg-slate-900 text-slate-200 rounded-lg border border-slate-800 focus:outline-none resize-none leading-relaxed"></textarea>
          </div>
        </div>

      </div>

      <!-- Footer Info Bar -->
      <div class="px-4 py-2.5 bg-slate-50 dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 text-[11px] text-slate-500 flex items-center justify-between">
        <span class="flex items-center gap-1.5">
          <i data-lucide="info" class="w-3.5 h-3.5 text-indigo-500"></i>
          티스토리 글 작성 시 <code class="px-1 py-0.5 bg-slate-200 dark:bg-slate-800 rounded font-bold">HTML 편집</code> 모드에서 붙여넣으세요.
        </span>
      </div>

    </section>

  </div>

  <!-- Save/Load Profiles Modal -->
  <div id="saveModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl w-full max-w-md shadow-2xl p-5 space-y-4">
      <div class="flex items-center justify-between border-b border-slate-100 dark:border-slate-800 pb-3">
        <h3 class="font-bold text-slate-800 dark:text-slate-100 flex items-center gap-2">
          <i data-lucide="bookmark" class="w-4 h-4 text-indigo-500"></i> 타임라인 보관함
        </h3>
        <button onclick="closeSaveModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- Current Save Slot Input -->
      <div class="flex gap-2">
        <input type="text" id="saveSlotName" placeholder="저장할 데이터 이름" class="flex-1 text-xs px-3 py-2 border border-slate-300 dark:border-slate-700 rounded bg-slate-50 dark:bg-slate-800 focus:outline-none">
        <button onclick="saveCurrentTimeline()" class="px-3 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold rounded transition">
          현재 상태 저장
        </button>
      </div>

      <!-- Saved List -->
      <div class="space-y-2 max-h-60 overflow-y-auto border-t border-slate-100 dark:border-slate-800 pt-3">
        <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">저장된 타임라인 목록</label>
        <div id="savedTimelinesList" class="space-y-2">
          <!-- Injected via JS -->
        </div>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="fixed bottom-6 right-6 z-50 transform translate-y-20 opacity-0 transition-all duration-300 bg-slate-900 text-white dark:bg-white dark:text-slate-900 text-xs px-4 py-3 rounded-lg shadow-xl flex items-center gap-2 pointer-events-none">
    <i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-400 dark:text-emerald-600"></i>
    <span id="toastMsg">클립보드에 복사되었습니다!</span>
  </div>

  <!-- Global Handler for Preview Tab Switch -->
  <script>
    // Keep active view state across re-renders
    window.previewActiveSubTab = 'main';

    window.switchPreviewSubTab = function(type, accentColor, randId) {
      window.previewActiveSubTab = type;
      
      var vMain = document.getElementById('view_main_' + randId);
      var vChar = document.getElementById('view_char_' + randId);
      var bMain = document.getElementById('btn_main_' + randId);
      var bChar = document.getElementById('btn_char_' + randId);

      if (type === 'main') {
        if (vMain) vMain.style.display = 'block';
        if (vChar) vChar.style.display = 'none';
        if (bMain) {
          bMain.style.backgroundColor = accentColor;
          bMain.style.color = '#ffffff';
          bMain.style.border = 'none';
          bMain.style.boxShadow = '0 2px 5px ' + accentColor + '40';
        }
        if (bChar) {
          bChar.style.backgroundColor = 'transparent';
          bChar.style.color = 'inherit';
          bChar.style.border = '1px solid rgba(150,150,150,0.3)';
          bChar.style.boxShadow = 'none';
        }
      } else {
        if (vMain) vMain.style.display = 'none';
        if (vChar) vChar.style.display = 'grid';
        if (bChar) {
          bChar.style.backgroundColor = accentColor;
          bChar.style.color = '#ffffff';
          bChar.style.border = 'none';
          bChar.style.boxShadow = '0 2px 5px ' + accentColor + '40';
        }
        if (bMain) {
          bMain.style.backgroundColor = 'transparent';
          bMain.style.color = 'inherit';
          bMain.style.border = '1px solid rgba(150,150,150,0.3)';
          bMain.style.boxShadow = 'none';
        }
      }
    };
  </script>

  <!-- App Script Logic -->
  <script>
    // Empty Initial Timeline State Object
    let timelineData = {
      accentColor: "#6366f1",
      fontFamily: "sans-serif",
      enableCharTimeline: false,
      events: [
        { time: "", title: "", desc: "", tag: "" }
      ],
      characters: [
        {
          name: "",
          role: "",
          events: [{ time: "", desc: "" }]
        }
      ]
    };

    // Initialize App
    document.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();
      initTheme();
      loadFromInputs();
      renderEventsInputs();
      renderCharactersInputs();
      updateTimeline();
    });

    // Dark Mode Switcher
    function initTheme() {
      const themeToggleBtn = document.getElementById('themeToggleBtn');
      if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
        document.documentElement.classList.add('dark');
      }
      themeToggleBtn.addEventListener('click', () => {
        document.documentElement.classList.toggle('dark');
      });
    }

    // Set Initial values to Input fields
    function loadFromInputs() {
      document.getElementById('accentColor').value = timelineData.accentColor;
      document.getElementById('accentColorText').value = timelineData.accentColor;
      document.getElementById('fontFamily').value = timelineData.fontFamily;
      
      const toggle = document.getElementById('enableCharTimeline');
      toggle.checked = timelineData.enableCharTimeline;
      toggleCharTimeline(timelineData.enableCharTimeline, false);
    }

    function setAccentColor(hex) {
      document.getElementById('accentColor').value = hex;
      document.getElementById('accentColorText').value = hex;
      updateTimeline();
    }

    function syncColorInput(hex) {
      if (/^#[0-9A-F]{6}$/i.test(hex)) {
        document.getElementById('accentColor').value = hex;
        updateTimeline();
      }
    }

    function toggleCharTimeline(enabled, triggerUpdate = true) {
      timelineData.enableCharTimeline = enabled;
      const sec = document.getElementById('charTimelineSection');
      const statusText = document.getElementById('charTimelineStatusText');

      if (enabled) {
        sec.classList.remove('hidden');
        statusText.innerText = 'ON';
        statusText.classList.add('text-indigo-600', 'dark:text-indigo-400');
      } else {
        sec.classList.add('hidden');
        statusText.innerText = 'OFF';
        statusText.classList.remove('text-indigo-600', 'dark:text-indigo-400');
        window.previewActiveSubTab = 'main';
      }

      if (triggerUpdate) updateTimeline();
    }

    // Render Main Timeline Events Inputs
    function renderEventsInputs() {
      const container = document.getElementById('eventsContainer');
      container.innerHTML = '';
      (timelineData.events || []).forEach((ev, index) => {
        const box = document.createElement('div');
        box.className = "p-3 border border-slate-200 dark:border-slate-800 rounded-lg bg-slate-50/50 dark:bg-slate-800/30 space-y-2";
        box.innerHTML = `
          <div class="grid grid-cols-1 md:grid-cols-3 gap-2">
            <input type="text" value="${escapeHtml(ev.time)}" oninput="updateEvent(${index}, 'time', this.value)" placeholder="시점 (예: 2024.01)" class="text-xs px-2.5 py-1.5 border border-slate-300 dark:border-slate-700 rounded bg-white dark:bg-slate-800 focus:outline-none">
            <input type="text" value="${escapeHtml(ev.title)}" oninput="updateEvent(${index}, 'title', this.value)" placeholder="사건 제목" class="md:col-span-2 text-xs font-bold px-2.5 py-1.5 border border-slate-300 dark:border-slate-700 rounded bg-white dark:bg-slate-800 focus:outline-none">
          </div>
          <div class="flex gap-2">
            <input type="text" value="${escapeHtml(ev.tag)}" oninput="updateEvent(${index}, 'tag', this.value)" placeholder="태그 (예: 중요)" class="w-1/3 text-xs px-2.5 py-1.5 border border-slate-300 dark:border-slate-700 rounded bg-white dark:bg-slate-800 focus:outline-none">
            <textarea oninput="updateEvent(${index}, 'desc', this.value)" rows="2" placeholder="상세 내용 설명..." class="flex-1 text-xs p-2 border border-slate-300 dark:border-slate-700 rounded bg-white dark:bg-slate-800 focus:outline-none resize-y leading-relaxed">${escapeHtml(ev.desc)}</textarea>
            <button onclick="removeEventRow(${index})" class="p-1 text-slate-400 hover:text-red-500 rounded transition self-start" title="사건 삭제">
              <i data-lucide="trash-2" class="w-4 h-4"></i>
            </button>
          </div>
        `;
        container.appendChild(box);
      });
      lucide.createIcons();
    }

    // Render Character Inputs
    function renderCharactersInputs() {
      const container = document.getElementById('charactersContainer');
      container.innerHTML = '';
      (timelineData.characters || []).forEach((char, cIdx) => {
        const card = document.createElement('div');
        card.className = "p-3.5 border border-slate-200 dark:border-slate-800 rounded-xl bg-white dark:bg-slate-800/60 space-y-3 shadow-sm";
        
        let charEventsHtml = (char.events || []).map((cev, eIdx) => `
          <div class="flex items-center gap-2">
            <input type="text" value="${escapeHtml(cev.time)}" oninput="updateCharEvent(${cIdx}, ${eIdx}, 'time', this.value)" placeholder="시점" class="w-24 text-xs px-2 py-1 border border-slate-300 dark:border-slate-700 rounded bg-slate-50 dark:bg-slate-800">
            <input type="text" value="${escapeHtml(cev.desc)}" oninput="updateCharEvent(${cIdx}, ${eIdx}, 'desc', this.value)" placeholder="인물 서사 상세 내용" class="flex-1 text-xs px-2 py-1 border border-slate-300 dark:border-slate-700 rounded bg-slate-50 dark:bg-slate-800">
            <button onclick="removeCharEventRow(${cIdx}, ${eIdx})" class="text-slate-400 hover:text-red-500 p-1" title="항목 삭제">
              <i data-lucide="x" class="w-3.5 h-3.5"></i>
            </button>
          </div>
        `).join('');

        card.innerHTML = `
          <div class="flex items-center justify-between gap-2 border-b border-slate-100 dark:border-slate-700 pb-2">
            <div class="grid grid-cols-2 gap-2 flex-1">
              <input type="text" value="${escapeHtml(char.name)}" oninput="updateChar(${cIdx}, 'name', this.value)" placeholder="인물 이름" class="text-xs font-bold px-2.5 py-1.5 border border-slate-300 dark:border-slate-700 rounded bg-slate-50 dark:bg-slate-800 focus:outline-none">
              <input type="text" value="${escapeHtml(char.role)}" oninput="updateChar(${cIdx}, 'role', this.value)" placeholder="수식어 / 역할" class="text-xs px-2.5 py-1.5 border border-slate-300 dark:border-slate-700 rounded bg-slate-50 dark:bg-slate-800 focus:outline-none">
            </div>
            <button onclick="removeCharacterRow(${cIdx})" class="p-1 text-slate-400 hover:text-red-500 rounded transition" title="인물 삭제">
              <i data-lucide="trash-2" class="w-4 h-4"></i>
            </button>
          </div>

          <div class="space-y-2">
            <div class="flex items-center justify-between">
              <span class="text-[11px] font-semibold text-slate-500 dark:text-slate-400">서사 시간대 목록</span>
              <button onclick="addCharEventRow(${cIdx})" class="text-[11px] font-medium text-indigo-600 dark:text-indigo-400 hover:underline flex items-center gap-0.5">
                <i data-lucide="plus" class="w-3 h-3"></i> 시간대 추가
              </button>
            </div>
            <div class="space-y-1.5">
              ${charEventsHtml}
            </div>
          </div>
        `;
        container.appendChild(card);
      });
      lucide.createIcons();
    }

    // Event Input Operations
    function addEventRow() {
      if (!timelineData.events) timelineData.events = [];
      timelineData.events.push({ time: "", title: "", desc: "", tag: "" });
      renderEventsInputs();
      updateTimeline();
    }

    function removeEventRow(index) {
      timelineData.events.splice(index, 1);
      renderEventsInputs();
      updateTimeline();
    }

    function updateEvent(index, field, val) {
      timelineData.events[index][field] = val;
      updateTimeline();
    }

    // Character Input Operations
    function addCharacterRow() {
      if (!timelineData.characters) timelineData.characters = [];
      timelineData.characters.push({
        name: "",
        role: "",
        events: [{ time: "", desc: "" }]
      });
      renderCharactersInputs();
      updateTimeline();
    }

    function removeCharacterRow(index) {
      timelineData.characters.splice(index, 1);
      renderCharactersInputs();
      updateTimeline();
    }

    function updateChar(index, field, val) {
      timelineData.characters[index][field] = val;
      updateTimeline();
    }

    function addCharEventRow(charIndex) {
      timelineData.characters[charIndex].events.push({ time: "", desc: "" });
      renderCharactersInputs();
      updateTimeline();
    }

    function removeCharEventRow(charIndex, eventIndex) {
      timelineData.characters[charIndex].events.splice(eventIndex, 1);
      renderCharactersInputs();
      updateTimeline();
    }

    function updateCharEvent(charIndex, eventIndex, field, val) {
      timelineData.characters[charIndex].events[eventIndex][field] = val;
      updateTimeline();
    }

    // Update Live Engine & Re-render
    function updateTimeline() {
      timelineData.accentColor = document.getElementById('accentColor').value;
      timelineData.fontFamily = document.getElementById('fontFamily').value;

      const generatedHTML = buildCleanTistoryTimelineHTML(timelineData);
      
      const previewWrapper = document.getElementById('previewWrapper');
      previewWrapper.innerHTML = generatedHTML;
      document.getElementById('generatedCode').value = generatedHTML;
    }

    // Clean HTML Builder for Tistory
    function buildCleanTistoryTimelineHTML(data) {
      const accent = data.accentColor;
      const fontStack = data.fontFamily === 'serif' 
        ? "'Noto Serif KR', 'Batang', serif" 
        : "'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
      
      const mainTextColor = "inherit";
      const subTextColor = "rgba(100, 116, 139, 0.9)";

      // Generate a static ID tag for smooth inline event handling
      const randId = 'tl_preview';

      // Active SubTab indicator
      const activeTab = window.previewActiveSubTab || 'main';

      // Interactive Tab Navigation Buttons
      let navTabsHtml = '';
      if (data.enableCharTimeline) {
        const mainStyle = activeTab === 'main'
          ? `background-color: ${accent}; color: #ffffff; border: none; box-shadow: 0 2px 5px ${accent}40;`
          : `background-color: transparent; color: ${mainTextColor}; border: 1px solid rgba(150,150,150,0.3); box-shadow: none;`;
        
        const charStyle = activeTab === 'char'
          ? `background-color: ${accent}; color: #ffffff; border: none; box-shadow: 0 2px 5px ${accent}40;`
          : `background-color: transparent; color: ${mainTextColor}; border: 1px solid rgba(150,150,150,0.3); box-shadow: none;`;

        navTabsHtml = `
          <div style="display: flex; gap: 8px; margin-bottom: 24px; border-bottom: 2px solid ${accent}25; padding-bottom: 10px;">
            <button type="button" onclick="switchPreviewSubTab('main', '${accent}', '${randId}')" id="btn_main_${randId}" style="padding: 7px 16px; font-size: 13px; font-weight: 700; border-radius: 8px; cursor: pointer; transition: all 0.2s; ${mainStyle}">
              메인 타임라인
            </button>
            <button type="button" onclick="switchPreviewSubTab('char', '${accent}', '${randId}')" id="btn_char_${randId}" style="padding: 7px 16px; font-size: 13px; font-weight: 600; border-radius: 8px; cursor: pointer; transition: all 0.2s; ${charStyle}">
              인물별 타임라인
            </button>
          </div>
        `;
      }

      // 1. Vertical Timeline Line Structure
      let eventsHtml = '';
      const validEvents = (data.events || []).filter(e => e.time.trim() !== '' || e.title.trim() !== '' || e.desc.trim() !== '');
      if (validEvents.length > 0) {
        const items = validEvents.map((e) => `
          <div style="position: relative; padding-left: 36px; padding-bottom: 28px;">
            <!-- Outer Ring Node Marker -->
            <div style="position: absolute; left: 0; top: 2px; width: 16px; height: 16px; border-radius: 50%; background: #ffffff; border: 3.5px solid ${accent}; box-shadow: 0 0 0 3px ${accent}20; box-sizing: border-box; z-index: 2;"></div>
            
            <div style="display: flex; flex-direction: column; gap: 4px;">
              <div style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 6px;">
                <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
                  ${e.time ? `<span style="font-size: 12px; font-weight: 700; color: ${accent}; font-family: monospace; background: ${accent}12; padding: 2px 8px; border-radius: 4px;">${escapeHtml(e.time)}</span>` : ''}
                  ${e.title ? `<span style="font-size: 15px; font-weight: 700; color: ${mainTextColor};">${escapeHtml(e.title)}</span>` : ''}
                </div>
                ${e.tag ? `<span style="font-size: 11px; font-weight: 600; background-color: ${accent}; color: #ffffff; padding: 2px 8px; border-radius: 4px;">${escapeHtml(e.tag)}</span>` : ''}
              </div>

              ${e.desc ? `<div style="margin-top: 6px; font-size: 13.5px; line-height: 1.65; color: ${subTextColor}; white-space: pre-line; word-break: break-word; border-left: 3px solid ${accent}; padding: 4px 0 4px 12px;">${escapeHtml(e.desc)}</div>` : ''}
            </div>
          </div>
        `).join('');

        const mainDisplay = (activeTab === 'main' || !data.enableCharTimeline) ? 'block' : 'none';
        eventsHtml = `
          <div id="view_main_${randId}" style="display: ${mainDisplay}; position: relative; padding-top: 4px; margin-top: 4px;">
            <!-- Vertical Connecting Stem Line -->
            <div style="position: absolute; left: 7px; top: 10px; bottom: 20px; width: 2px; background: linear-gradient(to bottom, ${accent}, ${accent}30); z-index: 1;"></div>
            ${items}
          </div>
        `;
      }

      // 2. Character Grid Vertical Timeline Rail View
      let charGridHtml = '';
      if (data.enableCharTimeline) {
        const validChars = (data.characters || []).filter(c => c.name.trim() !== '' || (c.events && c.events.length > 0));
        if (validChars.length > 0) {
          const charCards = validChars.map((c) => {
            const charEvs = (c.events || []).map(cev => `
              <div style="position: relative; padding-left: 20px; padding-bottom: 12px;">
                <!-- Small Node Marker -->
                <div style="position: absolute; left: 0; top: 5px; width: 8px; height: 8px; border-radius: 50%; background: ${accent}; z-index: 2;"></div>
                
                <div style="display: flex; flex-direction: column; gap: 2px;">
                  ${cev.time ? `<span style="font-size: 11px; font-weight: 700; color: ${accent}; font-family: monospace;">${escapeHtml(cev.time)}</span>` : ''}
                  <span style="font-size: 13px; line-height: 1.5; color: ${mainTextColor}; word-break: break-word;">${escapeHtml(cev.desc)}</span>
                </div>
              </div>
            `).join('');

            return `
              <div style="padding: 16px; border-radius: 10px; border-left: 3px solid ${accent}; background: rgba(0,0,0,0.02); display: flex; flex-direction: column; gap: 12px; width: 100%; box-sizing: border-box;">
                <div style="display: flex; align-items: baseline; justify-content: space-between; border-bottom: 1px dashed rgba(150,150,150,0.25); padding-bottom: 8px;">
                  <span style="font-size: 16px; font-weight: 700; color: ${mainTextColor};">${escapeHtml(c.name)}</span>
                  ${c.role ? `<span style="font-size: 11.5px; font-weight: 600; color: ${accent};">${escapeHtml(c.role)}</span>` : ''}
                </div>
                <!-- Vertical Timeline Rail Inside Character Cell -->
                <div style="position: relative; padding-top: 4px; margin-top: 4px;">
                  <div style="position: absolute; left: 3px; top: 8px; bottom: 12px; width: 2px; background: ${accent}30; z-index: 1;"></div>
                  ${charEvs}
                </div>
              </div>
            `;
          }).join('');

          const charDisplay = (activeTab === 'char') ? 'grid' : 'none';
          
          // Dynamic Grid Style: 1 person -> 1fr (100% full width), 2+ persons -> responsive multi-column grid
          const gridColumns = validChars.length === 1 
            ? '1fr' 
            : 'repeat(auto-fill, minmax(260px, 1fr))';

          charGridHtml = `
            <div id="view_char_${randId}" style="display: ${charDisplay}; grid-template-columns: ${gridColumns}; gap: 16px; width: 100%;">
              ${charCards}
            </div>
          `;
        }
      }

      // Empty Fallback
      if (validEvents.length === 0 && (!data.enableCharTimeline || (data.characters || []).length === 0)) {
        return `<div style="font-family: ${fontStack}; font-size: 13px; color: #94a3b8; text-align: center; padding: 40px 0;">
          좌측 입력 폼에 내용을 입력하면 타임라인이 생성됩니다.
        </div>`;
      }

      return `<div class="tistory-timeline-container" style="max-width: 680px; margin: 24px auto; padding: 0; font-family: ${fontStack}; box-sizing: border-box; text-align: left; background-color: transparent;">
  <!-- Interactive Navigation Tabs -->
  ${navTabsHtml}

  <!-- Main Timeline Section -->
  ${eventsHtml}

  <!-- Character Grid Timeline Section -->
  ${charGridHtml}
</div>`.trim();
    }

    // Helper: Escape HTML
    function escapeHtml(str) {
      if (!str) return '';
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // Tab View Toggle
    function switchTab(tab) {
      const pTab = document.getElementById('tabPreview');
      const cTab = document.getElementById('tabCode');
      const pBtn = document.getElementById('tabPreviewBtn');
      const cBtn = document.getElementById('tabCodeBtn');

      if (tab === 'preview') {
        pTab.classList.remove('hidden');
        cTab.classList.add('hidden');
        pBtn.className = "px-3 py-1.5 text-xs font-semibold rounded-lg bg-white dark:bg-slate-800 text-indigo-600 dark:text-indigo-400 shadow-sm border border-slate-200 dark:border-slate-700";
        cBtn.className = "px-3 py-1.5 text-xs font-semibold rounded-lg text-slate-600 dark:text-slate-400 hover:bg-slate-200 dark:hover:bg-slate-800";
      } else {
        pTab.classList.add('hidden');
        cTab.classList.remove('hidden');
        cBtn.className = "px-3 py-1.5 text-xs font-semibold rounded-lg bg-white dark:bg-slate-800 text-indigo-600 dark:text-indigo-400 shadow-sm border border-slate-200 dark:border-slate-700";
        pBtn.className = "px-3 py-1.5 text-xs font-semibold rounded-lg text-slate-600 dark:text-slate-400 hover:bg-slate-200 dark:hover:bg-slate-800";
      }
    }

    // Copy Generated HTML Code
    function copyHTML() {
      const codeText = document.getElementById('generatedCode').value;
      const textarea = document.createElement('textarea');
      textarea.value = codeText;
      document.body.appendChild(textarea);
      textarea.select();
      
      try {
        document.execCommand('copy');
        showToast("티스토리용 HTML 코드가 복사되었습니다!");
      } catch (err) {
        showToast("복사에 실패했습니다. 코드 탭에서 직접 선택해 복사해 주세요.");
      } finally {
        document.body.removeChild(textarea);
      }
    }

    // Toast Alert
    function showToast(msg) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMsg');
      toastMsg.innerText = msg;
      
      toast.classList.remove('translate-y-20', 'opacity-0');
      toast.classList.add('translate-y-0', 'opacity-100');

      setTimeout(() => {
        toast.classList.remove('translate-y-0', 'opacity-100');
        toast.classList.add('translate-y-20', 'opacity-0');
      }, 2500);
    }

    // Storage System (Local Storage Modal)
    function openSaveModal() {
      document.getElementById('saveModal').classList.remove('hidden');
      renderSavedTimelinesList();
    }

    function closeSaveModal() {
      document.getElementById('saveModal').classList.add('hidden');
    }

    function getSavedTimelines() {
      return JSON.parse(localStorage.getItem('tistory_timelines_data') || '{}');
    }

    function saveCurrentTimeline() {
      const nameInput = document.getElementById('saveSlotName');
      const name = nameInput.value.trim() || "무제 타임라인";
      
      const saved = getSavedTimelines();
      saved[name] = {
        updatedAt: new Date().toLocaleDateString(),
        data: timelineData
      };
      
      localStorage.setItem('tistory_timelines_data', JSON.stringify(saved));
      nameInput.value = '';
      showToast(`'${name}' 타임라인이 저장되었습니다.`);
      renderSavedTimelinesList();
    }

    function loadTimelineSlot(name) {
      const saved = getSavedTimelines();
      if (saved[name]) {
        timelineData = JSON.parse(JSON.stringify(saved[name].data));
        loadFromInputs();
        renderEventsInputs();
        renderCharactersInputs();
        updateTimeline();
        closeSaveModal();
        showToast(`'${name}' 타임라인을 불러왔습니다.`);
      }
    }

    function deleteTimelineSlot(name) {
      const saved = getSavedTimelines();
      delete saved[name];
      localStorage.setItem('tistory_timelines_data', JSON.stringify(saved));
      renderSavedTimelinesList();
      showToast(`'${name}' 항목이 삭제되었습니다.`);
    }

    function renderSavedTimelinesList() {
      const container = document.getElementById('savedTimelinesList');
      const saved = getSavedTimelines();
      const keys = Object.keys(saved);

      if (keys.length === 0) {
        container.innerHTML = '<div class="text-xs text-slate-400 py-3 text-center">저장된 데이터가 없습니다.</div>';
        return;
      }

      container.innerHTML = keys.map(key => `
        <div class="flex items-center justify-between p-2.5 bg-slate-50 dark:bg-slate-800 rounded-lg border border-slate-200 dark:border-slate-700">
          <div>
            <div class="text-xs font-bold text-slate-800 dark:text-slate-200">${escapeHtml(key)}</div>
            <div class="text-[10px] text-slate-400">${saved[key].updatedAt}</div>
          </div>
          <div class="flex items-center gap-1">
            <button onclick="loadTimelineSlot('${escapeHtml(key)}')" class="px-2 py-1 text-xs bg-indigo-50 dark:bg-indigo-900/40 text-indigo-600 dark:text-indigo-400 hover:bg-indigo-100 rounded font-medium">
              불러오기
            </button>
            <button onclick="deleteTimelineSlot('${escapeHtml(key)}')" class="p-1 text-slate-400 hover:text-red-500 rounded">
              <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
            </button>
          </div>
        </div>
      `).join('');
      lucide.createIcons();
    }

    // JSON Export/Import
    function exportJSON() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(timelineData, null, 2));
      const downloadAnchor = document.createElement('a');
      const fileName = `timeline_data.json`;
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", fileName);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
      showToast("JSON 파일로 내보냈습니다.");
    }

    function importJSON(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          if (imported && typeof imported === 'object') {
            timelineData = imported;
            loadFromInputs();
            renderEventsInputs();
            renderCharactersInputs();
            updateTimeline();
            showToast("JSON 데이터 불러오기 완료!");
          }
        } catch (err) {
          showToast("올바르지 않은 JSON 파일입니다.");
        }
      };
      reader.readAsText(file);
    }
  </script>
</body>
</html>
